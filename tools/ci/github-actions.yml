name: OpenMedia SDK CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        environment: [demo, production]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/third_party/vcpkg'
          vcpkgGitCommitId: 'master'

      - name: Configure CMake
        run: cmake --preset ${{ matrix.environment }} -DOME_BUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.environment }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.environment == 'production' && 'Release' || 'Debug' }} --output-on-failure

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openmedia-${{ matrix.environment }}
          path: build/bin/
