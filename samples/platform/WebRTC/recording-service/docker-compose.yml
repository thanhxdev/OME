version: '3.8'

services:
  recording-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webrtc-recording-service
    ports:
      - "3040:3040"
    environment:
      - RECORDING_PORT=3040
      - SIGNALING_WS_URL=ws://signaling-server:3000/ws
      - SFU_HTTP_URL=http://media-server:3010
      - SESSION_ID=event-001
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=broadcast-recordings
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - SEGMENT_DURATION_SECONDS=1800
    volumes:
      - recordings_data:/app/recording-service/recordings
    restart: unless-stopped
    depends_on:
      - minio
    networks:
      - webrtc-net

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: webrtc-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - webrtc-net

networks:
  webrtc-net:
    driver: bridge

volumes:
  recordings_data:
  minio_data:
