# ==========================================
# coturn configuration for Broadcast WebRTC
# ==========================================

# Network listeners
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Relay port range (Dynamic RTP UDP)
min-port=49152
max-port=65535

# External IP (Replace with actual public IP in production)
# external-ip=YOUR_PUBLIC_IP

# Realm and Authentication
realm=broadcast.local
lt-cred-mech

# Static long-term credential fallback
user=broadcast_user:broadcast_password

# Shared secret for ephemeral HMAC-SHA1 credentials (REST API mode)
use-auth-secret
static-auth-secret=broadcast_shared_turn_secret_change_in_production

# Security & Fingerprinting
fingerprint
stale-nonce=600

# High-Bandwidth Broadcast Optimization
# Maximum bandwidth per session in bytes/sec (50 MB/s = 400 Mbps per relay)
max-bps=52428800
bps-capacity=1048576000 # 1 Gbps total capacity

# Logging
verbose
log-file=/var/log/coturn/turnserver.log
simple-log

# Denial of Service Protection
cli-password=secret_cli_password
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# TLS Certificates (Uncomment when deploying with domain/certs)
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
