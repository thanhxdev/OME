global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'webrtc-monitoring-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['monitoring-service:9100', 'localhost:9100']

  - job_name: 'webrtc-signaling'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['signaling-server:3000', 'localhost:3000']
    scrape_interval: 5s

  - job_name: 'webrtc-sfu'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['media-server:3010', 'localhost:3010']
    scrape_interval: 5s
