<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lower Third</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent; 
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: flex-end;
        }

        .lower-third {
            margin-left: 80px;
            margin-bottom: 80px;
            display: flex;
            flex-direction: column;
        }

        .line {
            overflow: hidden;
            position: relative;
        }
        
        .name-box {
            background: linear-gradient(135deg, #1f1f2e 0%, #0d0d1a 100%);
            border-left: 8px solid #b200ff;
            color: #fff;
            padding: 15px 30px;
            display: inline-block;
            font-size: 36px;
            font-weight: 800;
            text-transform: uppercase;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
            transform: translateX(-110%);
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .title-box {
            background: #b200ff;
            color: #fff;
            padding: 8px 30px;
            display: inline-block;
            font-size: 22px;
            font-weight: 600;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
            transform: translateX(-110%);
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            transition-delay: 0.1s;
        }

        .lower-third.show .name-box,
        .lower-third.show .title-box {
            transform: translateX(0);
        }
        
        /* Shimmer effect */
        .name-box::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-20deg);
        }

        .lower-third.show .name-box::after {
            animation: shimmer 3s infinite 1s;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

    </style>
</head>
<body>

    <div class="lower-third" id="lowerThird">
        <div class="line">
            <div class="name-box" id="ltName">JOHN DOE</div>
        </div>
        <div class="line">
            <div class="title-box" id="ltTitle">Lead Developer</div>
        </div>
    </div>

    <script>
        function updateData(key, value) {
            try {
                let data = JSON.parse(value);
                if (key === 'lower_third') {
                    showLowerThird(data.name, data.title, data.duration);
                }
            } catch (e) {
                console.error("Invalid JSON data", e);
            }
        }

        let ltTimeout;
        
        function showLowerThird(name, title, duration = 6000) {
            const ltBox = document.getElementById('lowerThird');
            document.getElementById('ltName').innerText = name;
            document.getElementById('ltTitle').innerText = title;
            
            // Hide if already shown
            ltBox.classList.remove('show');
            
            setTimeout(() => {
                ltBox.classList.add('show');
                
                clearTimeout(ltTimeout);
                ltTimeout = setTimeout(() => {
                    ltBox.classList.remove('show');
                }, duration);
                
            }, 100);
        }

        window.updateData = updateData;

        // Local testing
        /*
        setTimeout(() => {
            updateData('lower_third', JSON.stringify({
                name: "ALEX MERCER", 
                title: "SENIOR ARCHITECT",
                duration: 5000
            }));
        }, 1000);
        */
    </script>
</body>
</html>
